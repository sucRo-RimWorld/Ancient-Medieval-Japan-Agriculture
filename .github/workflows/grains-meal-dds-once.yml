name: One-time Common Food DDS Export
on:
  push:
    branches:
      - fix/common-food-collection-dds-20261020
    paths:
      - .github/workflows/grains-meal-dds-once.yml
permissions:
  contents: write
jobs:
  convert:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/common-food-collection-dds-20261020
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'Pillow>=11,<13'
      - name: Export accepted PNGs without editing sources
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import shutil
          import struct
          from pathlib import Path
          from PIL import Image, ImageChops
          stems = {
              "AMJC_MixedGrainMeal": "dcd01588db4585504551d1ec88358cca5d33ee45",
              "AMJC_MixedGrainPorridge": "3c76850ed8e2728c744852de023ca8e8e8704602",
              "AMJC_MixedFlourFood": "77039e4a9b8667def01df83fae83ce57a3a7a37a",
          }
          for stem, sha in stems.items():
              directory = Path("Textures/Things/Item/Meal") / stem
              original = directory / (stem + "_a.png")
              data = original.read_bytes()
              actual = hashlib.sha1(b"blob " + str(len(data)).encode() + b"\x00" + data).hexdigest()
              assert actual == sha, (stem, actual, sha)
              assert all((directory / (stem + "_" + suffix + ".png")).read_bytes() == data for suffix in ("b","c")), stem
              with Image.open(original) as src:
                  sprite = src.convert("RGBA")
                  assert sprite.size == (256, 256) and sprite.getchannel("A").getbbox(), stem
                  destination = directory / (stem + "_a.dds")
                  sprite.save(destination, format="DDS", pixel_format="DXT5")
              with Image.open(destination) as dds:
                  actual_sprite = dds.convert("RGBA")
                  assert actual_sprite.size == sprite.size
                  assert actual_sprite.getchannel("A").getbbox()
                  assert actual_sprite.getpixel((0,0))[3] == sprite.getpixel((0,0))[3]
              raw = destination.read_bytes()
              assert raw[:4] == b"DDS " and raw[84:88] == b"DXT5"
              for suffix in ("b", "c"):
                  (directory / (stem + "_" + suffix + ".dds")).write_bytes(raw)
              print("Exported " + stem + " in DXT5 DDS, preserved all PNG bytes")
          PY
      - name: Commit derived DDS and remove one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Textures/Things/Item/Meal
          git rm -f .github/workflows/grains-meal-dds-once.yml
          git commit -m "Add DDS render companions for three approved common-food stacks"
          git push origin HEAD:refs/heads/fix/common-food-collection-dds-20261020
