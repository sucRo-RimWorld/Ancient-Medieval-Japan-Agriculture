name: Workshop subscriber candidate preflight (Actions, no YADA)
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: workshop-payload-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  subscriber-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Verify source release metadata/version compatibility
        run: python Tests/Release/validate_add_changenote.py
      - name: Stage exact runtime/legal candidate from explicit Actions allowlist
        run: python Tests/Release/stage_actions_candidate.py --output TestResults/WorkshopCandidate
      - name: Explicitly reject Steam publication in push/PR preflight
        run: test -f TestResults/WorkshopCandidate/About/About.xml && test -f TestResults/WorkshopCandidate/LICENSE
